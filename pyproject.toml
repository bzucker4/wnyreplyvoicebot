[project]
name = "snow_plow_dispatch_bot"
version = "0.1.0"
description = "AI voice agent that takes snow plow requests over the phone for a Western New York dispatch service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "twilio>=9.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snow_plow_dispatch_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
